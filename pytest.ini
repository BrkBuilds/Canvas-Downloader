[pytest]
# Only collect from tests/ - the repo root contains a full PyInstaller output
# tree (dist/Canvas Downloader/_internal/...) whose bundled numpy/bs4/aiohttp
# test suites pytest would otherwise try to collect and run.
testpaths = tests
norecursedirs = dist build .git __pycache__ docs assets styles memory-bank PANOPTO*
filterwarnings =
    ignore::DeprecationWarning
    # Streamlit "bare mode" (plain python, no `streamlit run`) warns about
    # missing ScriptRunContext on import/session access - expected in tests.
    ignore:.*ScriptRunContext.*
    ignore:.*Session state does not function.*
