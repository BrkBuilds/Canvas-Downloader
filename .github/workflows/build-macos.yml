name: Build macOS Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build macOS (.app)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.0"

      - name: Build .app bundle
        run: |
          source .venv/bin/activate
          rm -rf build/ dist/
          pyinstaller --clean Canvas_Downloader_macOS.spec

      - name: Ad-hoc code sign & Package
        run: |
          codesign --force --deep -s - --entitlements entitlements.mac.plist "dist/Canvas Downloader.app"
          hdiutil create -volname "Canvas Downloader" \
            -srcfolder "dist/Canvas Downloader.app" \
            -ov -format UDZO \
            dist/Canvas_Downloader_macOS.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Canvas_Downloader_macOS
          path: dist/Canvas_Downloader_macOS.dmg