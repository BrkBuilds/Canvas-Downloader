name: Build macOS DMG

on:
  workflow_dispatch:

jobs:
  build:
    name: Build macOS (.app)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract version
        id: version
        run: |
          set -euo pipefail
          VER=$(python3 -c "exec(open('version.py').read()); print(__version__)")
          echo "app_version=$VER" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir "pyinstaller>=6.0"
          pip install pywebview
          # Modern macOS notifications (UNUserNotificationCenter). Installed LAST and
          # pinned to the FINAL resolved pyobjc-core version, because every
          # pyobjc-framework-* package must share one version - and the pywebview
          # line above can bump pyobjc-core. Guarantees no version skew so the
          # UserNotifications binding imports cleanly at runtime (otherwise the app
          # silently falls back to the deprecated NSUserNotification path).
          PYOBJC_VER=$(python -c 'import objc; print(objc.__version__)')
          echo "Pinning pyobjc-framework-UserNotifications to ${PYOBJC_VER}"
          pip install --no-cache-dir "pyobjc-framework-UserNotifications==${PYOBJC_VER}"

      - name: Build .app bundle
        run: |
          set -euo pipefail
          source .venv/bin/activate
          rm -rf build/ dist/
          pyinstaller --clean Canvas_Downloader_macOS.spec

      - name: Verify .app exists
        run: |
          set -euo pipefail
          if [ ! -d "dist/Canvas Downloader.app" ]; then
            echo "::error::Canvas Downloader.app was not created - PyInstaller build failed."
            exit 1
          fi
          echo "✅ Canvas Downloader.app found"

      - name: Ad-hoc code sign & Package
        run: |
          set -euo pipefail
          codesign --force --deep --sign - --entitlements entitlements.mac.plist "dist/Canvas Downloader.app"
          
          # Use sindresorhus/create-dmg to build a beautiful DMG with the drag-to-applications visual guide
          cd dist
          npx create-dmg "Canvas Downloader.app" . --no-code-sign || echo "create-dmg failed, but continuing to see if it produced anything"
          
          # create-dmg names the file automatically (e.g. "Canvas Downloader <version>.dmg" or "Canvas Downloader.dmg")
          # We rename it to the expected artifact format
          mv "Canvas Downloader"*.dmg "Canvas_Downloader_v${{ steps.version.outputs.app_version }}_macOS.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Canvas_Downloader_macOS
          path: "dist/Canvas_Downloader_v${{ steps.version.outputs.app_version }}_macOS.dmg"
          retention-days: 14
