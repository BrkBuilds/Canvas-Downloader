name: Build macOS

on:
  workflow_dispatch:

jobs:
  build:
    name: Build — Intel (x86_64)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.0"

      - name: Build .app bundle
        run: |
          source .venv/bin/activate
          rm -rf build/ dist/
          pyinstaller --clean Canvas_Downloader_macOS.spec

      - name: Ad-hoc code sign
        run: |
          codesign --force --deep -s - "dist/Canvas Downloader.app"
          codesign --verify --verbose=2 "dist/Canvas Downloader.app"

      - name: Zip .app bundle
        run: |
          cd dist/
          zip -r -y "Canvas_Downloader_macOS.zip" "Canvas Downloader.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Canvas_Downloader_macOS
          path: dist/Canvas_Downloader_macOS.zip
          retention-days: 30
